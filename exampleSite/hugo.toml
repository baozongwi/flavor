baseURL = "https://bao2ongw1.github.io/"
defaultContentLanguage = "en"
locale = "en"
title = "Flavor"
theme = "flavor"
copyright = "your-name"
hasCJKLanguage = true

[pagination]
  pagerSize = 10

[permalinks]
  post = "/p/:slug/"
  page = "/:slug/"

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[params]
  description = "A technical blog."
  mainSections = ["post"]
  avatar = "img/avatar.png"
  favicon = "favicon.png"
  defaultSocialImage = "img/avatar.png"
  ogLocale = "en_US"
  license = "Licensed under CC BY-NC-SA 4.0"
  status = "Paper-light notes, blue-dark nights."

  [params.author]
    name = "your-name"
    email = "you@example.com"
    url = "/about/"

  [params.welcome]
    enabled = false
    text = ""

  [params.footer]
    since = 2024

  [params.typewriter]
    slogans = [
      "stay hungry, stay foolish",
    ]

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
    [menu.main.params]
      icon = "home"
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 2
    [menu.main.params]
      icon = "user"
  [[menu.main]]
    name = "Archives"
    url = "/archives/"
    weight = 3
    [menu.main.params]
      icon = "archives"
  [[menu.main]]
    name = "Links"
    url = "/links/"
    weight = 4
    [menu.main.params]
      icon = "link"

  [[menu.social]]
    name = "GitHub"
    url = "https://github.com/baozongwi/flavor"
    [menu.social.params]
      icon = "github"
  [[menu.social]]
    name = "RSS"
    url = "/index.xml"
    [menu.social.params]
      icon = "rss"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    lineNos = false
    tabWidth = 4

[imaging]
  quality = 80
  resampleFilter = "CatmullRom"
  hint = "picture"
